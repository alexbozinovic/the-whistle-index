name: Nightly Game Ingest

on:
  schedule:
    # 9 AM UTC = ~5 AM ET — after all US games are final
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to scan for completed games'
        required: false
        default: '2'
      max_games:
        description: 'Max games to process'
        required: false
        default: '15'

jobs:
  ingest-and-export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/python-data/requirements.txt

      - name: Install Python dependencies
        working-directory: backend/python-data
        run: pip install -r requirements.txt

      - name: Ingest recent completed games
        working-directory: backend/python-data
        env:
          PYTHONPATH: src
        run: |
          python scripts/ingest_recent_games.py \
            --days ${{ github.event.inputs.days || '2' }} \
            --max-games ${{ github.event.inputs.max_games || '15' }}

      - name: Export frontend snapshot
        working-directory: backend/python-data
        run: python scripts/export_frontend_snapshot.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/angular-app/package-lock.json

      - name: Install Angular dependencies
        working-directory: frontend/angular-app
        run: npm ci

      - name: Build Angular app
        working-directory: frontend/angular-app
        run: npm run build

      - name: Commit updated artifacts and snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/python-data/artifacts/
          git add frontend/angular-app/public/data/snapshot.json
          if git diff --staged --quiet; then
            echo "No new games — nothing to commit."
          else
            git commit -m "chore: nightly ingest $(date -u '+%Y-%m-%d')"
            git push
          fi

      # ── Deploy step ────────────────────────────────────────────────────────
      # Add your hosting deploy here once configured.
      # Examples:
      #   Firebase:  uses: FirebaseExtended/action-hosting-deploy@v0
      #   Netlify:   uses: netlify/actions/cli@master
      #   Vercel:    uses: amondnet/vercel-action@v25
      # ──────────────────────────────────────────────────────────────────────
